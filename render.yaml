services:
  - type: web
    name: risklens-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # You will enter your Neon PostgreSQL URL in the Render dashboard
      - key: GEMINI_API_KEY
        sync: false # You will need to enter this in the Render dashboard manually
      - key: ENVIRONMENT
        value: production
      - key: PYTHONPATH
        value: "/opt/render/project/src:/opt/render/project/src/backend"
      - key: USE_S3
        value: "False"
